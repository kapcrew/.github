name: Move Issues Between Iterations

on:
  workflow_dispatch:
    inputs:
      source_iteration:
        description: 'Source iteration number (e.g. 133). Leave empty for auto-detect'
        required: false
        type: string
      target_iteration:
        description: 'Target iteration number (e.g. 136). Leave empty for auto-detect'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

jobs:
  move-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Move issues between iterations
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const GIST_ID = '${{ vars.STATE_GIST_ID }}';
            const GIST_FILENAME = 'iteration-state.json';
            const PROJECT_NUMBER = 3; // ⚠️ Change to your project number
            const DEFAULT_ITERATION = 136; // ⚠️ Fallback if Gist is unavailable

            async function readStateFromGist() {
              try {
                if (!GIST_ID) return { currentIteration: DEFAULT_ITERATION };
                const { data: gist } = await github.rest.gists.get({ gist_id: GIST_ID });
                const file = gist.files[GIST_FILENAME];
                if (file?.content) {
                  const state = JSON.parse(file.content);
                  console.log(`📖 State loaded from Gist: iteration ${state.currentIteration}`);
                  return state;
                }
              } catch (error) {
                console.log(`⚠️ Failed to read Gist: ${error.message}`);
              }
              return { currentIteration: DEFAULT_ITERATION };
            }

            async function saveStateToGist(state) {
              try {
                if (!GIST_ID) return false;
                await github.rest.gists.update({
                  gist_id: GIST_ID,
                  files: { [GIST_FILENAME]: { content: JSON.stringify(state, null, 2) } }
                });
                console.log(`💾 State saved to Gist: iteration ${state.currentIteration}`);
                return true;
              } catch (error) {
                console.error(`❌ Failed to save Gist: ${error.message}`);
                return false;
              }
            }

            function normalizeIterationName(input) {
              if (!input) return null;
              return /^\d+$/.test(input.trim())
                ? `Iterations ${input.trim()}`
                : input.trim();
            }

            async function getAllProjectItems(projectId) {
              let allItems = [];
              let hasNextPage = true;
              let cursor = null;

              while (hasNextPage) {
                const result = await github.graphql(`
                  query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            content {
                              ... on Issue { number title url state }
                            }
                            fieldValues(first: 20) {
                              nodes {
                                ... on ProjectV2ItemFieldIterationValue {
                                  field { ... on ProjectV2IterationField { id name } }
                                  iterationId
                                  title
                                }
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  field { ... on ProjectV2SingleSelectField { name } }
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { projectId, cursor });

                allItems = allItems.concat(result.node.items.nodes);
                hasNextPage = result.node.items.pageInfo.hasNextPage;
                cursor = result.node.items.pageInfo.endCursor;
              }

              return allItems;
            }

            // ─── Resolve iteration names ───────────────────────────────────────

            const state = await readStateFromGist();
            const isScheduled = context.eventName === 'schedule';
            let sourceIterationName, targetIterationName;

            if (isScheduled) {
              sourceIterationName = normalizeIterationName(state.currentIteration.toString());
              targetIterationName = normalizeIterationName((state.currentIteration + 1).toString());
              console.log(`⏰ Scheduled run — iteration ${state.currentIteration}`);
            } else {
              const sourceInput = '${{ github.event.inputs.source_iteration }}';
              const targetInput = '${{ github.event.inputs.target_iteration }}';

              if (!sourceInput && !targetInput) {
                sourceIterationName = normalizeIterationName(state.currentIteration.toString());
                targetIterationName = normalizeIterationName((state.currentIteration + 1).toString());
                console.log('👤 Manual run — auto-detected iterations');
              } else {
                sourceIterationName = normalizeIterationName(sourceInput);
                targetIterationName = normalizeIterationName(targetInput);
                console.log('👤 Manual run — custom iterations');
              }
            }

            console.log(`🚀 Moving issues: "${sourceIterationName}" → "${targetIterationName}"`);

            // ─── Fetch project data ────────────────────────────────────────────

            let projectData;
            try {
              projectData = await github.graphql(`
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2IterationField {
                            id name
                            configuration {
                              iterations { id title }
                              completedIterations { id title }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner: context.repo.owner, number: PROJECT_NUMBER });
            } catch (error) {
              core.setFailed(`❌ Failed to fetch project: ${error.message}`);
              return;
            }

            const project = projectData.organization.projectV2;
            const iterationField = project.fields.nodes.find(f => f.name === 'Iterations');

            if (!iterationField) {
              core.setFailed('❌ Field "Iterations" not found in project');
              return;
            }

            const allIterations = [
              ...(iterationField.configuration.iterations || []),
              ...(iterationField.configuration.completedIterations || [])
            ];

            const sourceIteration = allIterations.find(i => i.title === sourceIterationName);
            const targetIteration = allIterations.find(i => i.title === targetIterationName);

            if (!sourceIteration) {
              core.setFailed(`❌ Iteration "${sourceIterationName}" not found. Available: ${allIterations.map(i => i.title).join(', ')}`);
              return;
            }
            if (!targetIteration) {
              core.setFailed(`❌ Iteration "${targetIterationName}" not found. Available: ${allIterations.map(i => i.title).join(', ')}`);
              return;
            }

            console.log(`✅ Project: ${project.title}`);

            // ─── Filter issues to move ─────────────────────────────────────────

            const allItems = await getAllProjectItems(project.id);
            console.log(`📊 Total project items: ${allItems.length}`);

            const itemsToMove = allItems.filter(item => {
              if (!item.content) return false;
              if (item.content.state === 'CLOSED') return false;

              // Skip issues with Status = Done
              const statusValue = item.fieldValues.nodes.find(fv => fv.field?.name === 'Status');
              if (statusValue?.name === 'Done') return false;

              const iterationValue = item.fieldValues.nodes.find(fv =>
                fv.field?.name === 'Iterations' && fv.iterationId
              );
              return iterationValue?.iterationId === sourceIteration.id;
            });

            console.log(`📋 Issues to move: ${itemsToMove.length}`);
            if (itemsToMove.length === 0) {
              console.log('✨ Nothing to move');
              return;
            }

            // ─── Move issues ───────────────────────────────────────────────────

            let movedCount = 0;

            for (const item of itemsToMove) {
              try {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { iterationId: $iterationId }
                    }) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: iterationField.id,
                  iterationId: targetIteration.id
                });

                movedCount++;
                console.log(`✅ #${item.content.number}: ${item.content.title}`);

              } catch (error) {
                console.error(`❌ Failed to move #${item.content?.number}: ${error.message}`);
              }
            }

            console.log(`📈 Done: ${movedCount} issue(s) moved`);

            // ─── Save updated state ────────────────────────────────────────────

            if (movedCount > 0) {
              const targetNum = parseInt(targetIterationName.replace(/\D/g, ''));
              if (targetNum) {
                await saveStateToGist({
                  currentIteration: targetNum,
                  lastUpdate: new Date().toISOString(),
                  lastSourceIteration: sourceIterationName,
                  lastTargetIteration: targetIterationName,
                  movedTasksCount: movedCount
                });
                console.log(`✅ Next run will move: ${targetNum} → ${targetNum + 1}`);
              }
            }

            console.log('🎉 Completed!');
